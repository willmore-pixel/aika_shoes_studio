<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Shoe Colour Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: one-screen app. Header, favourites, shoe stage, section tabs, scrolling swatch grid, style bar that opens a bottom sheet. Dark, Duolingo-like. */
:root {
  --bg: #131f24;
  --panel: #18262c;
  --tile: #1d2c33;
  --line: #37464f;
  --fg: #f1f7fb;
  --muted: #8a9ba5;
  --accent: #49c0f8;
  --accent-ink: #0b2a3a;
  --stage: #f1f1f3;
  --stage-line: #2a2522;
  --font: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); margin: 0; overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; position: relative; }

header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 2px solid var(--line); }
header h1 { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: .01em; color: var(--fg); }
header h1 span { color: var(--muted); font-weight: 700; }
.link-btn { font-weight: 800; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); padding: 6px 2px; }

.favs { display: grid; grid-template-columns: 1fr auto; align-items: center; row-gap: 6px; column-gap: 10px; padding: 10px 16px 8px; }
.favs-label { font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; flex: none; }
/* Swatches fan out like cut samples dropped on a table: tilted, overlapping, + square last (see swatch.pdf). */
.fav-row { grid-column: 1 / -1; grid-row: 2; display: flex; align-items: center; overflow-x: auto; min-width: 0; padding: 16px 18px; scrollbar-width: none; }
.fav-row::-webkit-scrollbar { display: none; }
/* Favourites look like cut leather samples: bigger squares with pinking-shear (zigzag) edges. */
.fav { position: relative; flex: none; width: 70px; height: 70px; padding: 0; transform: rotate(var(--tilt, 0deg)); }
.fav + .fav { margin-left: -16px; }
.fav:nth-child(4n+1) { --tilt: -38deg; }
.fav:nth-child(4n+2) { --tilt: 36deg; }
.fav:nth-child(4n+3) { --tilt: -40deg; }
.fav:nth-child(4n+4) { --tilt: 33deg; }
.fav[aria-pressed="true"], .fav:focus-visible { z-index: 2; }
.fav .x { transform: rotate(calc(-1 * var(--tilt, 0deg))); }
.fav { filter: drop-shadow(0 3px 3px rgba(0,0,0,.45)); }
/* A soft light-to-shadow sheen so each sample reads as a piece of leather, not a flat chip. */
.fav i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,.32), rgba(255,255,255,0) 42%, rgba(0,0,0,0) 58%, rgba(0,0,0,.3)), radial-gradient(circle at 30% 25%, rgba(255,255,255,.18), transparent 55%); }
.fav i { position: relative; display: block; width: 100%; height: 100%; clip-path: polygon(0.0% 0.0%,4.2% 4.0%,8.3% 0.0%,12.5% 4.0%,16.7% 0.0%,20.8% 4.0%,25.0% 0.0%,29.2% 4.0%,33.3% 0.0%,37.5% 4.0%,41.7% 0.0%,45.8% 4.0%,50.0% 0.0%,54.2% 4.0%,58.3% 0.0%,62.5% 4.0%,66.7% 0.0%,70.8% 4.0%,75.0% 0.0%,79.2% 4.0%,83.3% 0.0%,87.5% 4.0%,91.7% 0.0%,95.8% 4.0%,100.0% 0.0%,96.0% 4.2%,100.0% 8.3%,96.0% 12.5%,100.0% 16.7%,96.0% 20.8%,100.0% 25.0%,96.0% 29.2%,100.0% 33.3%,96.0% 37.5%,100.0% 41.7%,96.0% 45.8%,100.0% 50.0%,96.0% 54.2%,100.0% 58.3%,96.0% 62.5%,100.0% 66.7%,96.0% 70.8%,100.0% 75.0%,96.0% 79.2%,100.0% 83.3%,96.0% 87.5%,100.0% 91.7%,96.0% 95.8%,100.0% 100.0%,95.8% 96.0%,91.7% 100.0%,87.5% 96.0%,83.3% 100.0%,79.2% 96.0%,75.0% 100.0%,70.8% 96.0%,66.7% 100.0%,62.5% 96.0%,58.3% 100.0%,54.2% 96.0%,50.0% 100.0%,45.8% 96.0%,41.7% 100.0%,37.5% 96.0%,33.3% 100.0%,29.2% 96.0%,25.0% 100.0%,20.8% 96.0%,16.7% 100.0%,12.5% 96.0%,8.3% 100.0%,4.2% 96.0%,0.0% 100.0%,4.0% 95.8%,0.0% 91.7%,4.0% 87.5%,0.0% 83.3%,4.0% 79.2%,0.0% 75.0%,4.0% 70.8%,0.0% 66.7%,4.0% 62.5%,0.0% 58.3%,4.0% 54.2%,0.0% 50.0%,4.0% 45.8%,0.0% 41.7%,4.0% 37.5%,0.0% 33.3%,4.0% 29.2%,0.0% 25.0%,4.0% 20.8%,0.0% 16.7%,4.0% 12.5%,0.0% 8.3%,4.0% 4.2%); }
.fav[aria-pressed="true"] { filter: drop-shadow(0 0 1.5px var(--accent)) drop-shadow(0 0 1.5px var(--accent)) drop-shadow(0 3px 3px rgba(0,0,0,.45)); }
.fav.add { filter: none; display: grid; place-items: center; color: var(--muted); font-size: 26px; font-weight: 800; border: 2px dashed var(--line); border-radius: 4px; background: transparent; --tilt: 34deg; z-index: 1; }
.fav.add span { transform: rotate(-34deg); }
.fav .x { position: absolute; top: -7px; right: -7px; width: 20px; height: 20px; border-radius: 50%; background: #ff4b4b; color: #fff; font-size: 13px; line-height: 20px; text-align: center; font-weight: 900; }

.stage { position: relative; background: var(--stage); flex: none; height: clamp(170px, 30vh, 270px); display: grid; place-items: center; }
.stage svg { width: 100%; height: 100%; max-width: 520px; display: block; }
.stage .caption { position: absolute; left: 12px; right: 12px; width: fit-content; bottom: 10px; line-height: 1.3; font-size: 13px; font-weight: 800; color: var(--stage-line); background: rgba(255,255,255,.7); padding: 4px 10px; border-radius: 99px; }
@media (prefers-reduced-motion: reduce) { .sheet, .scrim { transition: none !important; } }

.sections { display: grid; grid-template-columns: repeat(2, 1fr); border-bottom: 2px solid var(--line); }
.sec { padding: 10px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; border-bottom: 3px solid transparent; margin-bottom: -2px; color: var(--muted); }
.sec b { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; border: 2px solid currentColor; font-size: 13px; font-weight: 900; }
.sec span { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }
.sec[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }


.grid-wrap { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 10px; }
.hint { margin: 0 0 10px; font-size: 14px; font-weight: 700; color: var(--muted); line-height: 1.4; }
.hint b { color: var(--fg); }
.sw.photo i { background-size: cover; background-position: center; }
.sw .x { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; background: #ff4b4b; color: #fff; font-size: 13px; line-height: 20px; text-align: center; font-weight: 900; }
.sw.snap { border-style: dashed; background: transparent; cursor: pointer; }
.sw.snap i { display: grid; place-items: center; font-size: 22px; }
.sw.snap input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
.fav.pulse { animation: pulse .5s ease; }
@keyframes pulse { 50% { scale: 1.09; } }
@media (prefers-reduced-motion: reduce) { .fav.pulse { animation: none; } }
.sw { aspect-ratio: 1; max-width: 100%; border-radius: 16px; border: 2px solid var(--line); background: var(--tile); padding: 9px; display: block; position: relative; }
.sw i { display: block; width: 100%; height: 100%; border-radius: 10px; overflow: hidden; }
.sw i svg { width: 100%; height: 100%; display: block; }
.sw[aria-pressed="true"] { border-color: var(--accent); background: #213a47; box-shadow: 0 0 0 1px var(--accent) inset; }
.sw.none i { background: repeating-linear-gradient(135deg, #2a3a42 0 6px, #22323a 6px 12px); display: grid; place-items: center; color: var(--muted); font-weight: 900; font-size: 13px; }

.stylebar { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 2px solid var(--line); background: var(--panel); text-align: left; width: 100%; }
.stylebar small { display: block; font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
.stylebar strong { font-size: 16px; font-weight: 800; }
.chev { width: 34px; height: 34px; border-radius: 10px; border: 2px solid var(--line); display: grid; place-items: center; font-weight: 900; transition: transform .2s; }
.app.sheet-open .chev { transform: rotate(180deg); }

.scrim { position: absolute; inset: 0; background: rgba(5,12,15,.55); opacity: 0; pointer-events: none; transition: opacity .2s; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 2px solid var(--line); border-radius: 20px 20px 0 0; padding: 10px 16px calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateY(105%); transition: transform .25s ease; }
.app.sheet-open .scrim { opacity: 1; pointer-events: auto; }
.app.sheet-open .sheet { transform: none; }
.grab { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
.sheet h2 { margin: 0 0 12px; font-size: 17px; font-weight: 800; display: flex; justify-content: space-between; align-items: baseline; }
.sheet h2 span { font-size: 13px; color: var(--muted); font-weight: 700; }
.styles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (max-width: 360px) { .styles { grid-template-columns: repeat(2, 1fr); } }
.style-card { border: 2px solid var(--line); border-radius: 16px; background: var(--tile); padding: 8px 6px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.style-card .thumb { width: 100%; aspect-ratio: 16/10; border-radius: 10px; background: var(--stage); display: grid; place-items: center; overflow: hidden; }
.style-card .thumb svg { width: 100%; height: 100%; display: block; }
.style-card span { font-size: 13px; font-weight: 800; text-align: center; }
.style-card[aria-pressed="true"] { border-color: var(--accent); background: #213a47; }
.sheet-actions { display: flex; gap: 10px; margin-top: 14px; }
.btn { flex: 1; padding: 11px; border-radius: 14px; border: 2px solid var(--line); font-weight: 800; font-size: 14px; text-transform: uppercase; letter-spacing: .06em; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: 0 3px 0 #1b8ec2; }

.toast { position: absolute; left: 50%; top: 64px; transform: translateX(-50%); background: var(--fg); color: var(--bg); font-weight: 800; font-size: 13px; padding: 8px 14px; border-radius: 99px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
</style>

<div class="app" id="app">
  <header>
    <h1>Shoe Colour Studio</h1>
    <button class="link-btn" id="shuffle" type="button">Shuffle</button>
  </header>

  <div class="favs">
    <div class="favs-label">Favourites</div>
    <div class="fav-row" id="favs"></div>
    <button class="link-btn" id="editFavs" type="button">Edit</button>
  </div>

  <div class="stage">
    <svg id="shoe" viewBox="0 20 1020 460" role="img" aria-label="Shoe preview"></svg>
    <div class="caption" id="caption"></div>
  </div>

  <div class="sections" role="tablist" id="sections"></div>


  <div class="grid-wrap"><p class="hint" id="hint">Tap a part first (A, B…), on the tabs or on the shoe, then pick a colour or pattern. You can still pick one and tap <b>+</b> to save it.</p><div class="grid" id="grid"></div></div>

  <button class="stylebar" id="stylebar" type="button" aria-expanded="false">
    <div><small>款式 · Style</small><strong id="styleName"></strong></div>
    <div class="chev" aria-hidden="true">⌃</div>
  </button>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" aria-hidden="true">
    <div class="grab"></div>
    <h2>Choose a style <span>Colours carry over</span></h2>
    <div class="styles" id="styles"></div>
    <div class="sheet-actions">
      <button class="btn" id="reset" type="button">Reset colours</button>
      <button class="btn primary" id="closeSheet" type="button">Done</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

    shape: {"a":"M1119.218,1955.245C1118.916,1955.567 1117.763,1956.505 1117.763,1956.505L1087.225,1975.724C1087.94,1980.582 1106.723,1983.969 1120.251,1984.393C1147.114,1985.236 1207.933,1984.543 1248.228,1984.806C1288.371,1985.068 1333.172,1987.944 1361.342,2002.558C1385.441,2014.538 1402.72,2029.664 1418.365,2045.872C1418.365,2045.872 1418.804,2046.128 1418.401,2046.255C1327.975,2074.917 1282.674,2090.105 1248,2090.364C1203.054,2087.733 1148.476,2081.864 1099.536,2072.385C1044.162,2061.66 976.384,2052.407 915.757,2026.015C915.847,2014.819 918.011,2003.38 922.007,1995.701C924.366,1991.167 927.364,1987.944 930.949,1986.854C959.483,1978.177 1050.685,1973.647 1075.177,1968.329L1118.059,1949.12C1119.778,1948.971 1120.662,1949.896 1120.765,1951.825C1120.765,1951.825 1119.985,1954.427 1119.218,1955.245Z","b":"M1533.37,2026.015C1502.685,1972.831 1464.687,1950.083 1425.993,1941.426C1388.099,1932.947 1347.031,1935.882 1320.403,1939.184C1279.97,1944.197 1227.509,1952.131 1198.557,1948.274C1182.626,1946.151 1175.242,1938.326 1171.029,1927.836C1156.286,1938.189 1141.286,1946.752 1120.319,1955.346L1087.225,1975.724C1087.94,1980.582 1106.723,1983.969 1120.251,1984.393C1147.114,1985.236 1207.933,1984.543 1248.228,1984.806C1288.371,1985.068 1333.172,1987.944 1361.342,2002.558C1385.441,2014.538 1402.72,2029.664 1418.365,2045.872C1435.279,2039.437 1462.613,2030.022 1472.235,2028.672C1493.658,2025.666 1513.151,2026.366 1533.37,2026.015Z","c":"M1171.982,1927.836C1172.716,1926.002 1208.49,1889.28 1244.173,1863.019C1256.95,1853.617 1273.342,1842.912 1283.545,1836.611C1292.894,1830.838 1305.796,1826.488 1317.602,1827.393C1332.094,1828.503 1351.479,1839.634 1363.038,1845.88C1375.588,1852.661 1397.005,1865.055 1426.035,1877.828C1457.396,1891.625 1475.381,1897.825 1501.608,1899.516C1509.562,1900.029 1540.085,1897.021 1545.507,1890.021C1556.354,1912.672 1563.177,1937.046 1565.348,1963.415C1566.694,1987.518 1562.984,2008.935 1551.109,2026.015L1534.001,2026.015L1429.8,1969.818L1206.665,1957.76C1178.255,1948.563 1164.584,1938.686 1171.982,1927.836Z","d":"M1545.507,1889.639C1564.874,1941.175 1572.169,1988.576 1550.375,2026.015L1656.475,2021.414C1675.323,1961.11 1661.931,1902.015 1635.668,1843.403L1545.507,1889.639Z"},
  }
};

// Every part key any style uses. Each style lists its own parts (loafer 2, high heel 3, Oxford 4).
// The sole is not offered yet; it always shows as the real sole.
const PARTS = ["a", "b", "c", "d"];
const partsOf = (k = state.style) => Object.keys(STYLES[k].parts);
// Swap the embedded images for short blob: URLs once, so redraws don't copy the image data around.
function toBlobUrl(dataUrl) {
  try {
    const [head, b64] = dataUrl.split(","), bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return URL.createObjectURL(new Blob([bytes], { type: head.slice(5, head.indexOf(";")) }));
  } catch { return dataUrl; }
}
PRINTS.forEach(p => p.url = toBlobUrl(p.src));
Object.values(STYLES).forEach(st => { if (st.photo) st.photo = toBlobUrl(st.photo); });

const DEFAULT = { a: {c:null, p:null}, b: {c:null, p:null}, c: {c:null, p:null}, d: {c:null, p:null} };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

// Swatches customers photograph in the shop. They live only in this phone's browser and behave like prints,
// except they keep the leather shading (they're photos of leather, not canvas).
let myPhotos = store.get("scs-photos", []);
const addMyPhotos = () => myPhotos.forEach(m => PRINT[m.key] = { ...m, mine: true, kind: "leather" });
// The shop's own swatch photos, uploaded to the aika_swatches repo and published (cropped, listed in swatches.json) to its site;
// leather ones keep the leather shading, canvas ones get the canvas look.
const SWATCH_SITE = "https://willmore-pixel.github.io/aika_swatches/";
let SHOP = [];
async function loadShop() {
  try {
    const r = await fetch(SWATCH_SITE + "swatches.json", { cache: "no-store" });
    if (r.ok) SHOP = (await r.json()).map(x => ({ key: "shop/" + x.file, name: x.name, kind: x.kind, url: SWATCH_SITE + x.file }));
  } catch {}
  SHOP.forEach(x => PRINT[x.key] = x);
}
addMyPhotos();

let state = store.get("scs-design-2", null) || { style: "loafer", parts: structuredClone(DEFAULT) };
if (!STYLES[state.style]) state.style = "loafer";
// Drop saved picks whose swatch no longer exists (run once the shop's swatches have loaded).
const tidyState = () => PARTS.forEach(p => { state.parts[p] = state.parts[p] || { c: null, p: null }; if (state.parts[p].p && !PRINT[state.parts[p].p]) state.parts[p].p = null; });
let favs = store.get("scs-favs", ["#C8323C", "#2D5DA8", "#F5DE8A"]);
let active = null, editing = false;

const $ = id => document.getElementById(id);
const save = () => store.set("scs-design-2", state);

function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(h, t, amt) { const a = hexToRgb(h), b = hexToRgb(t); return "#" + a.map((v, i) => Math.round(v + (b[i] - v) * amt).toString(16).padStart(2, "0")).join(""); }
function lum(h) { const [r, g, b] = hexToRgb(h); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; }
function ink(h) { return lum(h) > 0.55 ? mix(h, "#000000", 0.5) : mix(h, "#ffffff", 0.45); }
function colourName(h) { return !h ? "Original" : NAME[h.toLowerCase()] || h.toUpperCase(); }
const same = (x, y) => (x || "").toLowerCase() === (y || "").toLowerCase();

function patternDef(id, kind, scale = 1) {
  return `<pattern id="${id}" patternUnits="userSpaceOnUse" width="96" height="96" patternTransform="scale(${scale})"><image href="${PRINT[kind].url}" width="96" height="96" preserveAspectRatio="xMidYMid slice"/></pattern>`;
}

function fillFor(part, prefix) { const s = state.parts[part]; return s.p ? `url(#${prefix}-${part})` : s.c || "#FFFFFF"; }
// Photo styles: the original photo, then each recoloured part is a greyscale copy of the photo
// clipped to that part, multiplied by the chosen colour so the leather's shading shows through.
// A part's area: its drawn shape, minus any shapes drawn above it.
const above = (st, p) => st.order.slice(st.order.indexOf(p) + 1);
const drawn = (st, list, attrs) => `<g transform="translate(${st.tr})">${list.map(q => `<path d="${st.shape[q]}" ${attrs(q)}/>`).join("")}</g>`;
function partShape(st, p) {
  return drawn(st, [p], () => 'fill="#fff"') + drawn(st, above(st, p), () => 'fill="#000"');
}

function photoMarkup(st, prefix, interactive) {
  const keys = Object.keys(st.parts).reverse();
  const recoloured = keys.filter(p => state.parts[p].c || state.parts[p].p);
  const grey = (id, slope, icpt) => `<filter id="${id}" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values="0"/><feComponentTransfer>${["R","G","B"].map(ch => `<feFunc${ch} type="linear" slope="${slope}" intercept="${icpt}"/>`).join("")}</feComponentTransfer></filter>`;
  const defs = grey(`${prefix}-grey-a`, 2.1, -1.08) + grey(`${prefix}-grey-b`, 1.5, -0.36) + grey(`${prefix}-grey-c`, 1.5, -0.36) + grey(`${prefix}-grey-d`, 1.5, -0.36) +
    // Canvas prints: matte, so the leather's grain and shine are blurred away and highlights clip to white; only soft folds stay.
    `<filter id="${prefix}-canvas" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="0.9"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer>${["R","G","B"].map(ch => `<feFunc${ch} type="linear" slope="1.4" intercept="-0.26"/>`).join("")}</feComponentTransfer></filter>` +
    // A faint over-under weave laid on top of the print.
    `<pattern id="${prefix}-weave" patternUnits="userSpaceOnUse" width="4" height="4"><rect width="4" height="4" fill="#fff"/><rect y="0" width="2" height="2" fill="#000" opacity=".1"/><rect x="2" y="2" width="2" height="2" fill="#000" opacity=".1"/><rect y="3" width="4" height="1" fill="#000" opacity=".05"/></pattern>` +
    (interactive && active ? `<mask id="${prefix}-hl" maskUnits="userSpaceOnUse" x="0" y="0" width="${st.w}" height="${st.h}"><rect width="${st.w}" height="${st.h}" fill="#fff"/>${drawn(st, above(st, active), () => 'fill="#000"')}</mask>` : "") +
    recoloured.map(p => `<mask id="${prefix}-clip-${p}" maskUnits="userSpaceOnUse" x="0" y="0" width="${st.w}" height="${st.h}">${partShape(st, p)}</mask>` + (state.parts[p].p ? patternDef(`${prefix}-${p}`, state.parts[p].p, st.w / 420) : "")).join("");
  const layers = recoloured.map(p => `<g mask="url(#${prefix}-clip-${p})" style="isolation:isolate"><use href="#${prefix}-photo" filter="url(#${prefix}-${state.parts[p].p && PRINT[state.parts[p].p].kind !== "leather" ? "canvas" : "grey-" + p})"/><rect width="${st.w}" height="${st.h}" fill="${fillFor(p, prefix)}" style="mix-blend-mode:multiply"/>${state.parts[p].p && PRINT[state.parts[p].p].kind !== "leather" ? `<rect width="${st.w}" height="${st.h}" fill="url(#${prefix}-weave)" style="mix-blend-mode:multiply"/>` : ""}</g>`).join("");
  // Tap areas stack in drawing order, so the upper shape wins where shapes overlap.
  const hits = interactive ? drawn(st, st.order, q => `class="hit" data-part="${q}" fill="transparent"`) +
    (active ? `<g mask="url(#${prefix}-hl)" pointer-events="none">${drawn(st, [active], () => 'fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="5" stroke-linejoin="round"')}${drawn(st, [active], () => 'fill="none" stroke="#6b7280" stroke-width="3" stroke-dasharray="10 7" stroke-linecap="round" stroke-linejoin="round"')}</g>` : "") : "";
  return `<defs>${defs}<image id="${prefix}-photo" href="${st.photo}" width="${st.w}" height="${st.h}"/></defs><use href="#${prefix}-photo"/>${layers}${hits}`;
}

const shoeMarkup = (styleKey, prefix, interactive) => photoMarkup(STYLES[styleKey], prefix, interactive);

function renderShoe() {
  const svg = $("shoe");
  svg.setAttribute("viewBox", STYLES[state.style].viewBox);
  svg.innerHTML = shoeMarkup(state.style, "pm", true);
  svg.querySelectorAll(".hit").forEach(el => el.addEventListener("click", () => setActive(el.dataset.part)));
  svg.onclick = e => { if (!e.target.dataset.part && active) setActive(active); };
  const names = STYLES[state.style].parts, label = p => PRINT[state.parts[p].p] ? PRINT[state.parts[p].p].name : colourName(state.parts[p].c);
  const changed = partsOf().filter(p => state.parts[p].c || state.parts[p].p);
  $("caption").textContent = active ? `${names[active]} · ${label(active)}` : changed.length ? changed.map(p => `${names[p]}: ${label(p)}`).join(" · ") : STYLES[state.style].name;
}

function renderSections() {
  const names = STYLES[state.style].parts;
  $("sections").style.gridTemplateColumns = `repeat(${partsOf().length}, 1fr)`;
  $("sections").innerHTML = partsOf().map(p =>
    `<button class="sec" role="tab" type="button" aria-selected="${p === active}" data-p="${p}"><b>${p.toUpperCase()}</b><span>${names[p]}</span></button>`).join("");
  $("sections").querySelectorAll(".sec").forEach(b => b.addEventListener("click", () => setActive(b.dataset.p)));
}

// A swatch item is either a colour ("#RRGGBB") or one of the shop's prints ("print:key").
const isPrint = it => typeof it === "string" && it.startsWith("print:");
const printOf = it => PRINT[it.slice(6)];
const itemName = it => isPrint(it) ? (printOf(it) || {}).name : colourName(it);
let picked = null;  // the last swatch tapped; this is what + saves

function renderGrid() {
  const cur = active ? state.parts[active] : null;
  const on = it => active ? (isPrint(it) ? cur.p === it.slice(6) : !cur.p && same(cur.c, it)) : picked === it;
  const g = $("grid");
  $("hint").hidden = !!active;
  g.innerHTML = `<button class="sw none" type="button" title="The shoe's own colour" aria-label="Original colour" aria-pressed="${!!cur && cur.c === null && !cur.p}" data-orig="1"><i style="font-size:20px">↺</i></button>` +
    COLOURS.map(([n, h]) => `<button class="sw" type="button" title="${n}" aria-label="${n}" aria-pressed="${on(h)}" data-c="${h}"><i style="background:${h}"></i></button>`).join("") +
    [...SHOP.filter(x => x.kind === "leather"), ...PRINTS, ...SHOP.filter(x => x.kind !== "leather"), ...myPhotos].map(p => `<button class="sw photo" type="button" title="${p.name}" aria-label="${p.name}" aria-pressed="${on("print:" + p.key)}" data-pat="${p.key}"><i style="background-image:url('${p.url}')"></i>${editing && PRINT[p.key].mine ? '<span class="x" aria-hidden="true">×</span>' : ""}</button>`).join("") +
    `<label class="sw snap" title="Photograph a swatch" aria-label="Photograph a swatch"><i>📷</i><input id="snap" type="file" accept="image/*" capture="environment"></label>`;
  g.querySelectorAll("[data-c]").forEach(b => b.addEventListener("click", () => pick(b.dataset.c)));
  g.querySelectorAll("[data-pat]").forEach(b => b.addEventListener("click", () => {
    if (editing && PRINT[b.dataset.pat].mine) return removePhoto(b.dataset.pat);
    pick("print:" + b.dataset.pat);
  }));
  $("snap").addEventListener("change", e => { if (e.target.files[0]) addPhoto(e.target.files[0]); });
  g.querySelector("[data-orig]").addEventListener("click", () => { if (active) setColour(null); });
}

// A photographed swatch: crop the middle square, shrink it, keep it on this phone, and pick it.
function addPhoto(file) {
  const img = new Image(), src = URL.createObjectURL(file);
  img.onload = () => {
    const side = Math.min(img.width, img.height), c = document.createElement("canvas");
    c.width = c.height = 320;
    c.getContext("2d").drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, 320, 320);
    URL.revokeObjectURL(src);
    const n = myPhotos.reduce((m, p) => Math.max(m, p.n), 0) + 1;
    const m = { key: "mine" + Date.now(), n, name: `My swatch ${n}`, url: c.toDataURL("image/jpeg", 0.85) };
    myPhotos.push(m);
    while (myPhotos.length > 12) removePhoto(myPhotos[0].key, true);
    store.set("scs-photos", myPhotos); addMyPhotos();
    pick("print:" + m.key);
  };
  img.src = src;
}
function removePhoto(key, quiet) {
  myPhotos = myPhotos.filter(m => m.key !== key); delete PRINT[key];
  favs = favs.filter(f => f !== "print:" + key);
  PARTS.forEach(p => { if (state.parts[p].p === key) state.parts[p].p = null; });
  if (picked === "print:" + key) picked = null;
  if (quiet) return;
  store.set("scs-photos", myPhotos); store.set("scs-favs", favs); save(); renderAll();
}

// Tapping a swatch: with a part chosen it is applied; either way it becomes the one + saves.
function pick(it) {
  picked = it;
  if (active) { if (isPrint(it)) setPattern(it.slice(6)); else setColour(it); }
  else renderGrid();
  renderFavs();
}

function renderFavs() {
  favs = favs.filter(it => !isPrint(it) || printOf(it));
  $("favs").innerHTML = favs.map((it, i) =>
    `<button class="fav" type="button" title="${itemName(it)}" aria-label="Favourite ${itemName(it)}" aria-pressed="${!active && picked === it}" data-i="${i}"><i style="${isPrint(it) ? `background-image:url('${printOf(it).url}');background-size:cover` : `background:${it}`}"></i>${editing ? '<span class="x" aria-hidden="true">×</span>' : ""}</button>`).join("") +
    (favs.length < 12 ? `<button class="fav add" type="button" id="addFav" aria-label="Save the picked colour or pattern to favourites"><span>+</span></button>` : "");
  $("favs").querySelectorAll("[data-i]").forEach(b => b.addEventListener("click", () => {
    const i = +b.dataset.i;
    if (editing) { favs.splice(i, 1); store.set("scs-favs", favs); renderFavs(); return; }
    const it = favs[i];
    pick(it);
  }));
  const add = $("addFav");
  if (add) add.addEventListener("click", () => {
    const cur = active && state.parts[active];
    const it = picked || (cur && (cur.p && PRINT[cur.p] ? "print:" + cur.p : cur.c));
    if (!it) return;
    const i = favs.findIndex(f => same(f, it));
    if (i < 0) { favs.push(it); store.set("scs-favs", favs); renderFavs(); }
    pulse(i < 0 ? favs.length - 1 : i);
  });
  $("editFavs").textContent = editing ? "Done" : "Edit";
}

function renderStyles() {
  $("styleName").textContent = STYLES[state.style].name;
  $("styles").innerHTML = Object.entries(STYLES).map(([k, s]) =>
    `<button class="style-card" type="button" aria-pressed="${k === state.style}" data-s="${k}"><div class="thumb"><svg viewBox="${s.viewBox}">${shoeMarkup(k, "th-" + k, false)}</svg></div><span>${s.name}</span></button>`).join("");
  $("styles").querySelectorAll("[data-s]").forEach(b => b.addEventListener("click", () => {
    state.style = b.dataset.s; if (active && !partsOf().includes(active)) active = null; save(); renderAll(); openSheet(false);
  }));
}

// A quick bounce on the favourite instead of a pop-up message.
function pulse(i) {
  const el = $("favs").querySelector(`[data-i="${i}"]`);
  if (!el) return;
  el.classList.remove("pulse"); void el.offsetWidth; el.classList.add("pulse");
  el.scrollIntoView({ block: "nearest", inline: "nearest" });
}

function renderAll() { renderShoe(); renderSections(); renderGrid(); renderFavs(); renderStyles(); }

// Tapping the chosen part (or its tab) again, or the empty space around the shoe, clears the choice.
function setActive(p) { active = active === p ? null : p; picked = null; renderShoe(); renderSections(); renderGrid(); renderFavs(); }
// With no part chosen, picks do nothing (the palette stays live, just inactive).
const targets = () => active ? [active] : [];
function setColour(c) {
  if (!active) return;
  targets().forEach(p => { state.parts[p].c = c; state.parts[p].p = null; }); save(); renderShoe(); renderStyles(); renderGrid();
}
function setPattern(p) { if (!active) return; targets().forEach(t => { state.parts[t].p = p; state.parts[t].c = null; }); save(); renderShoe(); renderGrid(); renderStyles(); }

function openSheet(open) {
  $("app").classList.toggle("sheet-open", open);
  $("stylebar").setAttribute("aria-expanded", open);
  $("sheet").setAttribute("aria-hidden", !open);
}

let toastTimer;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1600); }

$("editFavs").addEventListener("click", () => { editing = !editing; renderFavs(); renderGrid(); });
$("stylebar").addEventListener("click", () => openSheet(!$("app").classList.contains("sheet-open")));
$("scrim").addEventListener("click", () => openSheet(false));
$("closeSheet").addEventListener("click", () => openSheet(false));
$("reset").addEventListener("click", () => { state.parts = structuredClone(DEFAULT); save(); renderAll(); toast("Colours reset"); });
$("shuffle").addEventListener("click", () => {
  const pick = () => COLOURS[Math.floor(Math.random() * COLOURS.length)][1];
  partsOf().forEach(p => { state.parts[p].c = pick(); state.parts[p].p = Math.random() < 0.2 ? PRINTS[Math.floor(Math.random() * PRINTS.length)].key : null; });
  save(); renderAll();
});

loadShop().then(() => { tidyState(); renderAll(); });
</script>

</body></html>
