# Rebuilds and publishes the website whenever anything is pushed to main (swatch photos live in the aika_swatches repo).
name: Publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # Build and upload in one job, publish in a second one: when the publish step ran straight after the upload,
  # GitHub sometimes couldn't find the just-uploaded files yet ("No artifacts named github-pages").
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: mkdir _site && cp -r play _site/  # AIKA PLAY at /play/; no root page, so the old address shows 404
      # The same page again at /app/, as a fresh app identity for phones whose Chrome kept a broken install of /play/.
      - run: |
          cp -r play _site/app
          sed -i 's/"aika-play-app"/"aika-play-app-2"/' _site/app/manifest.webmanifest
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
