# Rebuilds and publishes the website whenever anything is pushed to main (swatch photos live in the aika_swatches repo).
name: Publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir _site && cp index.html _site/ && cp -r play _site/  # AIKA PLAY at /play/
      # The same page again at /app/, as a fresh app identity for phones whose Chrome kept a broken install of /play/.
      - run: |
          cp -r play _site/app
          sed -i 's/"aika-play-app"/"aika-play-app-2"/' _site/app/manifest.webmanifest
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
